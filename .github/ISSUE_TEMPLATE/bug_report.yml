name: Bug report
description: Something in a @devicons-pack/* package is wrong or broken.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - @devicons-pack/svg
        - @devicons-pack/react
        - @devicons-pack/preact
        - @devicons-pack/vue
        - @devicons-pack/solid
        - @devicons-pack/svelte
        - @devicons-pack/astro
        - @devicons-pack/angular
        - @devicons-pack/lit
        - @devicons-pack/web-components
        - @devicons-pack/alpine
        - @devicons-pack/htmx
        - The docs site
        - Other / repo tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 4.0.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Include the import statement and a minimal snippet.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "bundler + version, framework + version, node version"
